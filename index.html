<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather Bro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<color>';inherits:false;initial-value:#1668c8}
@property --b{syntax:'<color>';inherits:false;initial-value:#5ba8f0}
:root{--blue:#1668c8;--sun:#f2a56b;--ink:#1a1f29;--white:#fff;--glass:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--white);background:#1668c8;background:linear-gradient(180deg,var(--a),var(--b)) fixed;transition:--a 1.4s,--b 1.4s;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;align-items:center;gap:12px}
header img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--white)}
.word{font-weight:900;font-size:24px;line-height:.95;letter-spacing:-.02em}
.word b{color:var(--blue);background:#fff;border-radius:6px;padding:0 6px;margin-left:2px}
.search{position:relative;margin-top:18px}
.search input{width:100%;height:52px;border-radius:26px;border:2px solid transparent;padding:0 20px;font:600 16px 'Inter',system-ui,sans-serif;color:var(--ink);background:#fff;outline:none}
.search input:focus-visible{border-color:var(--sun);box-shadow:0 0 0 4px rgba(242,165,107,.45)}
.sug{position:absolute;left:0;right:0;top:58px;background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 20px;font:600 15px 'Inter',system-ui,sans-serif;color:var(--ink);cursor:pointer}
.sug button small{display:block;font-weight:400;color:#5c6676}
.sug button:hover,.sug button:focus-visible{background:#e9f1fb;outline:none}
.hero{margin-top:34px}
.city{font-size:22px;font-weight:800}
.sub{opacity:.85;font-weight:600}
.temp{font-size:clamp(96px,28vw,150px);font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0 0 -4px}
.temp sup{font-size:.4em;vertical-align:top;position:relative;top:.18em;letter-spacing:0}
.desc{font-size:24px;font-weight:800}
.stats{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.stats div{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px;min-width:96px}
.stats small{display:block;opacity:.8;font-weight:600;font-size:13px}
.stats strong{font-size:18px;font-weight:800}
h2{font-size:17px;font-weight:800;margin:30px 0 12px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.day{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:16px 10px;text-align:center}
.day .n{font-weight:800;text-transform:capitalize}
.day .i{font-size:38px;margin:8px 0}
.day .mx{font-size:24px;font-weight:900}
.day .mn{opacity:.75;font-weight:600}
.day .p{margin-top:8px;font-size:13px;font-weight:700;color:#fff;background:rgba(22,104,200,.75);border-radius:10px;padding:3px 0}
.demo{margin-top:30px;font-size:13px;opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--glass-b);background:var(--glass);color:#fff;border-radius:20px;padding:7px 12px;font:700 13px 'Inter',system-ui,sans-serif;cursor:pointer}
.chips button:focus-visible,.chips button:hover{background:var(--sun);color:var(--ink);outline:none}
.note{margin-top:18px;font-size:12px;opacity:.75}
[hidden]{display:none!important}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}
.greet{font-size:15px;font-weight:700;opacity:.95}.phrase{font-weight:800;font-size:19px;margin-bottom:18px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bar button{border:1px solid var(--glass-b);background:var(--glass);color:#fff;border-radius:20px;font:700 14px 'Inter',system-ui,sans-serif;cursor:pointer;padding:7px 12px}
.bar button.on{background:var(--sun);color:var(--ink)}.bar button:focus-visible{outline:3px solid var(--sun)}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.hr{flex:0 0 66px;text-align:center;background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:10px 4px;scroll-snap-align:start;font-weight:700}
.hr i{display:block;font-style:normal;font-size:24px;margin:4px 0}.hr small{display:block;font-size:12px;opacity:.9}
.rng{height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:8px 6px;position:relative}
.rng span{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#8fd0ff,var(--sun))}
.day .w{font-size:12px;opacity:.85;margin-top:6px;font-weight:600}
.stats button{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px;color:#fff;font:inherit;text-align:left;cursor:pointer}
.stats button:hover{background:var(--glass-b)}.stats button:focus-visible,#sx:focus-visible{outline:3px solid var(--sun)}
#ov{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;max-height:84vh;overflow:auto;background:#1a1f29;color:#fff;border-radius:26px 26px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){#ov{align-items:center}.sheet{border-radius:26px}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
#sx{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:16px;cursor:pointer}
.sheet h3{font-size:20px;font-weight:800;margin:0 40px 10px 0}.sheet p{line-height:1.5;opacity:.9;margin:8px 0}
.bv{font-size:52px;font-weight:900;letter-spacing:-.03em}
.mt{height:10px;border-radius:5px;position:relative;margin:18px 0 10px}
.mt i{position:absolute;top:-5px;width:6px;height:20px;border-radius:3px;background:#fff;transform:translateX(-50%)}
.bs{display:flex;gap:3px;align-items:flex-end;height:110px;margin-top:14px;border-bottom:1px solid rgba(255,255,255,.3)}
.bs div{flex:1;background:linear-gradient(#8fd0ff,#1668c8);border-radius:3px 3px 0 0}
.bl{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-top:4px}
.soon{margin-top:14px;padding:16px;border-radius:16px;background:rgba(22,104,200,.35);font-weight:700}
.leaflet-pane,.leaflet-tile,.leaflet-layer,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:#0f1520;touch-action:none;-webkit-tap-highlight-color:transparent;outline:0}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
#wm .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.7)}
#wm{height:340px;border-radius:16px;position:relative;overflow:hidden;margin-top:14px}
#wh{width:100%;margin:14px 0 0;accent-color:#f2a56b}
.lg{height:8px;border-radius:4px;margin-top:12px;background:linear-gradient(90deg,#a8dcff,#4d9cf5,#f2a56b,#ff7a45)}
.at{display:block;opacity:.6;font-size:11px;margin-top:6px}

:root{color-scheme:dark}
body{font-weight:400}
.word{font-weight:600;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.word b{background:none;color:#7db8ff;padding:0;margin:0;border-radius:0;font-weight:600}
header img{box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.search input{height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(8,22,46,.4);color:#fff;font-weight:400;font-size:15px}
.search input::placeholder{color:rgba(255,255,255,.6)}
.sug{border-radius:10px;background:#12233f;color:#fff;top:54px}
.sug button{color:#fff;font-weight:500}.sug button small{color:rgba(255,255,255,.6)}
.sug button:hover,.sug button:focus-visible{background:rgba(255,255,255,.1)}
.greet{font-weight:400;opacity:.75;font-size:14px}.phrase{font-weight:500;font-size:17px}
.city{font-weight:500;font-size:20px}.sub{font-weight:400;opacity:.65;font-size:14px}
.temp{font-weight:200;letter-spacing:-.05em}.temp sup{font-weight:200}
.desc{font-weight:400;font-size:20px;opacity:.9}
.bar button{border-radius:8px;background:transparent;font-weight:500;font-size:13px;padding:7px 11px;border-color:rgba(255,255,255,.3)}
.bar button.on{background:var(--sun);color:#12233f;border-color:var(--sun)}
.stats{grid-template-columns:1fr 1fr;gap:0 28px;margin-top:22px}
.stats button{background:none;border:0;border-bottom:1px solid rgba(255,255,255,.16);border-radius:0;padding:12px 0;backdrop-filter:none;-webkit-backdrop-filter:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.stats small{display:inline;opacity:.65;font-weight:400;font-size:13px}.stats strong{font-weight:500;font-size:15px}
.stats button:hover{background:rgba(255,255,255,.06)}
h2{font-size:13px;font-weight:500;opacity:.7;margin:34px 0 10px}
.hr{background:none;border:0;border-left:1px solid rgba(255,255,255,.16);border-radius:0;font-weight:500;font-size:13px;flex:0 0 58px}
.hr i{margin:6px auto;width:22px;height:22px}.hr i svg{width:22px;height:22px;display:block}.hr small{opacity:.65;font-weight:400}
.days{grid-template-columns:1fr;gap:0}
.day{display:grid;grid-template-columns:86px 30px 38px 1fr 38px;align-items:center;column-gap:10px;row-gap:2px;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.16);border-radius:0;padding:12px 0;backdrop-filter:none;-webkit-backdrop-filter:none}
.day .n{font-weight:500;text-transform:capitalize;grid-column:1;grid-row:1}.day .i{margin:0;font-size:0;grid-column:2;grid-row:1}.day .i svg{width:24px;height:24px;display:block}
.day .mn{text-align:right;opacity:.6;font-weight:400;grid-column:3;grid-row:1}.day .rng{grid-column:4;grid-row:1;margin:0}
.day .mx{font-size:16px;font-weight:500;grid-column:5;grid-row:1}
.day .w,.day .p{grid-row:2;font-size:12px;opacity:.65;margin:0;font-weight:400}
.day .w{grid-column:1/4}.day .p{grid-column:4/6;background:none;text-align:right;color:#fff;padding:0;border-radius:0}
.sheet{background:#12233f;border-radius:16px 16px 0 0}@media(min-width:700px){.sheet{border-radius:16px}}
.sheet h3{font-weight:600;font-size:18px}.bv{font-weight:300}#sx{border-radius:8px}
.chips button{border-radius:8px;font-weight:500;background:transparent;display:inline-flex;gap:6px;align-items:center}.chips svg{width:16px;height:16px}
#wm{border-radius:10px}.soon{border-radius:10px}.rng,.mt{border-radius:2px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button,.rc button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:7px 12px;font:500 13px 'Inter',system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--sun);border-color:var(--sun);color:#12233f}.tabs button:focus-visible,.rc button:focus-visible{outline:3px solid var(--sun)}
.al{font-weight:500;font-size:16px;margin:6px 0 0}
#rm{height:340px;border-radius:10px;position:relative;overflow:hidden;margin-top:6px}
#rm .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.7)}
.rc{display:flex;align-items:center;gap:10px;margin-top:12px}.rc input{flex:1;accent-color:#f2a56b;min-width:0}.rc span{font-size:13px;opacity:.85;white-space:nowrap}
.at a{color:inherit}
</style>
</head>

}

  const g=cx.createRadialGradient(x,y,0,x,y,170*p);g.addColorStop(0,'rgba(255,230,170,.95)');g.addColorStop(.25,'rgba(242,165,107,.5)');g.addColorStop(1,'rgba(242,165,107,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,170*p,0,7);cx.fill();
  cx.save();cx.translate(x,y);cx.rotate(t/9000);cx.strokeStyle='rgba(255,236,190,.22)';cx.lineWidth=6;cx.lineCap='round';for(let i=0;i<12;i++){cx.rotate(Math.PI/6);cx.beginPath();cx.moveTo(70,0);cx.lineTo(110+(i%2)*30,0);cx.stroke()}cx.restore();

  const x=W*.8,y=H*.15;cx.fillStyle='#f4efe2';cx.beginPath();cx.arc(x,y,32,0,7);cx.fill();cx.fillStyle='rgba(16,27,56,.9)';cx.beginPath();cx.arc(x+14,y-6,28,0,7);cx.fill()}
 const dark=k==='rain'||k==='storm';
 for(const c of clouds){c.x+=c.v;if(c.x>W+250)c.x=-300;
  if(c.fog){const g=cx.createLinearGradient(c.x-300,0,c.x+300,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=g;cx.fillRect(c.x-300,c.y,600,90)}else cloud(c,dark)}

 if(k==='vi'){const v=d.vis/1000;return['Visibilidad',big(Math.round(v*10)/10+' km',v>=10?'Excelente':v>=4?'Buena':v>=1?'Reducida: manejá con cuidado':'Muy baja: extremá precauciones')+mt(v,0,10,'#e5534b,#f2d04b,#4cc38a')+'<p>Distancia hasta donde se distinguen los objetos. Baja con niebla, lluvia fuerte o humo.</p>']}
 if(k==='rn'){const x=d.hours.reduce((a,b)=>b.pop>a.pop?b:a);return['Lluvia',alertR(d)+TABS+'<div id="tp">'+big(Math.round(d.rain*10)/10+' mm','Acumulado hoy')+`<p>Probabilidad por hora, próximas 24 h. Pico: ${x.pop}% a las ${hh(x.h)}h.</p><div class="bs">${d.hours.map(y=>`<div title="${y.pop}%" style="height:${Math.max(2,y.pop)}%"></div>`).join('')}</div><div class="bl"><span>${hh(d.hours[0].h)}h</span><span>${hh(d.hours[12].h)}h</span><span>${hh(d.hours[23].h)}h</span></div></div>`+RAD]}
 const a=mn(d.sr),b=mn(d.ss),n=new Date(),m=n.getHours()*60+n.getMinutes(),p=Math.min(1,Math.max(0,(m-a)/(b-a))),up=m>=a&&m<=b,fm=t=>Math.floor(t/60)+' h '+t%60+' min';
 return['Amanecer y atardecer',`<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Recorrido del sol"><path d="M20 100A130 130 0 0 1 280 100" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-dasharray="6 6"/><line x1="10" y1="100" x2="290" y2="100" stroke="rgba(255,255,255,.4)"/><circle cx="${150-130*Math.cos(Math.PI*p)}" cy="${100-130*Math.sin(Math.PI*p)}" r="11" fill="#f2a56b" opacity="${up?1:.35}"/><text x="20" y="122" fill="#fff" font-size="13">${d.sr}</text><text x="280" y="122" fill="#fff" font-size="13" text-anchor="end">${d.ss}</text></svg><p><b>${fm(b-a)} de luz hoy.</b> ${up?'Faltan '+fm(b-m)+' para el atardecer.':m<a?'El sol sale a las '+d.sr+'.':'El sol ya se puso. Mañana sale cerca de las '+d.sr+'.'}</p>`]}
const TABS='<div class="tabs"><button class="on" data-t="p">Probabilidad</button><button data-t="r">Radar</button></div>';
const RAD='<div id="tr" hidden><div id="rm"></div><div class="rc"><button id="rp">Pausa</button><input id="rs" type="range" min="0" max="5" value="5" aria-label="Imagen de radar"><span id="rl"></span></div><p id="rt">Cargando radar…</p><small class="at">Weather data by <a href="https://www.rainviewer.com" target="_blank" rel="noopener">Rain Viewer</a> · © OpenStreetMap contributors</small></div>';
const alertR=d=>{const H=d.hours,i=H.findIndex(x=>x.pop>=50),mx=H.reduce((a,b)=>b.pop>a.pop?b:a);return`<p class="al">${i===0?'Lluvia probable en la próxima hora':i>0?'Lluvia probable hacia las '+hh(H[i].h)+'h':mx.pop>=30?'Posible lluvia: hasta '+mx.pop+'% a las '+hh(mx.h)+'h':'Sin lluvia probable en las próximas 24 horas'}</p>`};
function initRain(){const t=document.querySelectorAll('.tabs button');t.forEach(x=>x.onclick=()=>{t.forEach(y=>y.classList.toggle('on',y===x));const r=x.dataset.t==='r';$('#tp').hidden=r;$('#tr').hidden=!r;WM&&WM.stop();WM=null;if(r)initRadar()})}
async function initRadar(){
 const box=$('#rm'),rt=$('#rt'),sl=$('#rs'),pb=$('#rp');
 if(typeof L==='undefined'){box.textContent='El mapa necesita conexión a internet.';return}
 const c=lastC,map=L.map(box,{zoomControl:false,attributionControl:false,minZoom:4,maxZoom:7}).setView([c.lat,c.lon],6);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:7}).addTo(map);
 L.circleMarker([c.lat,c.lon],{radius:6,color:'#fff',weight:2,fillColor:'#f2a56b',fillOpacity:1}).addTo(map);
 map.createPane('rp').style.zIndex=250;
 let ly=[],i=0,tm,play=true,alive=true;
 WM={stop(){alive=false;clearInterval(tm);map.remove()}};
 try{const j=await getJSON('https://api.rainviewer.com/public/weather-maps.json');if(!alive)return;
  const pa=j.radar.past,fr=pa.filter((_,k)=>(pa.length-1-k)%2===0).slice(-6);
  ly=fr.map(f=>({t:f.time,l:L.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{pane:'rp',opacity:0,maxNativeZoom:7,maxZoom:7}).addTo(map)}))}
 catch(e){if(alive)rt.textContent='No pudimos cargar el radar. Revisá tu conexión e intentá de nuevo.';return}
 if(!ly.length){rt.textContent='No hay imágenes de radar disponibles ahora.';return}
 sl.max=ly.length-1;
 const show=n=>{i=n;ly.forEach((o,k)=>o.l.setOpacity(k===n?.8:0));sl.value=n;const m=Math.round((Date.now()/1000-ly[n].t)/60);$('#rl').textContent=new Date(ly[n].t*1000).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' ('+(m<=2?'ahora':'hace '+m+' min')+')'};
 show(ly.length-1);
 const go=()=>{clearInterval(tm);if(play)tm=setInterval(()=>show((i+1)%ly.length),800)};
 pb.onclick=()=>{play=!play;pb.textContent=play?'Pausa':'Reproducir';go()};
 sl.oninput=()=>{play=false;pb.textContent='Reproducir';clearInterval(tm);show(+sl.value)};
 go();rt.textContent='Lluvia de las últimas 2 horas. Si el mapa no muestra colores, no hay lluvia en la zona.'}
let WM=null;
const DIR=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const WCOL=s=>s<12?'#a8dcff':s<28?'#4d9cf5':s<45?'#f2a56b':'#ff7a45';
function initWind(){
 const box=$('#wm'),sl=$('#wh'),ro=$('#wr'),N=7;
 if(typeof L==='undefined'){box.textContent='El mapa necesita conexión a internet.';return}
 const c=lastC,map=L.map(box,{zoomControl:false,attributionControl:false,minZoom:4,maxZoom:9}).setView([c.lat,c.lon],6);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:9}).addTo(map);
 L.circleMarker([c.lat,c.lon],{radius:6,color:'#fff',weight:2,fillColor:'#f2a56b',fillOpacity:1}).addTo(map);
 let G=null,hr=0,dem=false,P=[],raf,tm;
 const cv=document.createElement('canvas'),cx2=cv.getContext('2d');cv.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:450';box.appendChild(cv);
 async function grid(){const b=map.getBounds().pad(.25),s=b.getSouth(),n=b.getNorth(),w=b.getWest(),e=b.getEast(),la=[],lo=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){la.push((s+(n-s)*i/(N-1)).toFixed(2));lo.push((w+(e-w)*j/(N-1)).toFixed(2))}
  let data;
  try{const j=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=wind_speed_10m,wind_direction_10m&forecast_hours=25&timezone=auto`);
   data=j.map(p=>p.hourly.wind_speed_10m.map((v,h)=>{const r=p.hourly.wind_direction_10m[h]*Math.PI/180;return[-v*Math.sin(r),-v*Math.cos(r)]}));dem=false}
  catch(x){dem=true;data=la.map((_,k)=>{const i=Math.floor(k/N),j=k%N;return Array.from({length:25},(_,h)=>{const v=Math.max(8,lastD.wind)*(.5+.9*Math.abs(Math.sin(i*.7+h*.1))),r=Math.sin(j*.6+i*.4)*1.2+h*.03+1;return[-v*Math.sin(r),-v*Math.cos(r)]})})}
  G={s,n,w,e,data};ro.textContent=(dem?'Datos de ejemplo. ':'')+'Tocá el mapa para ver el viento en un punto.'}
 function wind(lat,lng){if(!G)return null;const fy=(lat-G.s)/(G.n-G.s)*(N-1),fx=(lng-G.w)/(G.e-G.w)*(N-1);if(fx<0||fy<0||fx>N-1||fy>N-1)return null;
  const i=Math.min(N-2,fy|0),j=Math.min(N-2,fx|0),ty=fy-i,tx=fx-j,g=(a,b)=>G.data[a*N+b][hr],m=k=>(1-ty)*((1-tx)*g(i,j)[k]+tx*g(i,j+1)[k])+ty*((1-tx)*g(i+1,j)[k]+tx*g(i+1,j+1)[k]);return[m(0),m(1)]}
 function reset(){const r=devicePixelRatio||1,W=box.clientWidth,H=box.clientHeight;cv.width=W*r;cv.height=H*r;cx2.setTransform(r,0,0,r,0,0);P=Array.from({length:550},()=>({x:Math.random()*W,y:Math.random()*H,a:Math.random()*60}))}
 function step(){const W=box.clientWidth,H=box.clientHeight;cx2.globalCompositeOperation='destination-out';cx2.fillStyle='rgba(0,0,0,.07)';cx2.fillRect(0,0,W,H);cx2.globalCompositeOperation='source-over';cx2.lineWidth=1.6;
  for(const p of P){const ll=map.containerPointToLatLng([p.x,p.y]),v=wind(ll.lat,ll.lng);if(!v||p.a++>80){p.x=Math.random()*W;p.y=Math.random()*H;p.a=0;continue}
   const nx=p.x+v[0]*.07,ny=p.y-v[1]*.07;cx2.strokeStyle=WCOL(Math.hypot(v[0],v[1]));cx2.beginPath();cx2.moveTo(p.x,p.y);cx2.lineTo(nx,ny);cx2.stroke();p.x=nx;p.y=ny}
  raf=requestAnimationFrame(step)}
 const need=()=>{const b=map.getBounds();return!G||b.getSouth()<G.s||b.getNorth()>G.n||b.getWest()<G.w||b.getEast()>G.e};
 map.on('moveend',()=>{reset();clearTimeout(tm);if(need())tm=setTimeout(grid,500)});
 map.on('click',e=>{const v=wind(e.latlng.lat,e.latlng.lng);if(!v)return;const sp=Math.hypot(v[0],v[1]),dg=(Math.atan2(-v[0],-v[1])*180/Math.PI+360)%360;ro.textContent=`${WD(sp)} desde el ${DIR[Math.round(dg/22.5)%16]}`+(dem?' (ejemplo)':'')});
 sl.oninput=()=>{hr=+sl.value;$('#wl').innerHTML='<b>'+(hr?'En '+hr+' h ('+hh((new Date().getHours()+hr)%24)+':00)':'Ahora')+'</b>'};
 WM={stop(){cancelAnimationFrame(raf);clearTimeout(tm);map.remove()}};
 grid().then(()=>{if(!WM)return;reset();step()})}
let lf;
function closeSheet(){WM&&WM.stop();WM=null;ov.hidden=true;lf&&lf.focus()}
document.querySelector('.stats').onclick=e=>{const b=e.target.closest('button[data-d]');if(!b)return;const [t,h]=detail(b.dataset.d==='ss'?'sr':b.dataset.d);$('#sh-t').textContent=t;$('#sb').innerHTML=h;lf=b;ov.hidden=false;$('#sx').focus();if(b.dataset.d==='w')initWind();if(b.dataset.d==='rn')initRain()};
$('#sx').onclick=closeSheet;ov.onclick=e=>{if(e.target===ov)closeSheet()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeSheet()});
size();setSky('clear',true);load(city);
</script>
